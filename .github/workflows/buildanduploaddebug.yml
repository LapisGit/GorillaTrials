name: im boutta build!!!!!!!! (debug)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_release:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ${{ inputs.project-path }}

    - name: Build
      id: build
      run: dotnet build ${{ inputs.project-path }} --no-restore -c Debug

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: GorillaTrials.dll
        path: bin\Release\netstandard2.1\GorillaTrials.dll

          
